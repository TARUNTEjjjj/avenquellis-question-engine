name: Build and verify exact C++ WebAssembly
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  exact-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install official pinned Emscripten SDK locally
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin d7b4130688bfa348392b921ab04015aa15c4f154
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.13
          ./emsdk activate 6.0.13
      - name: Verify pristine sources, native suite, and build WebAssembly
        run: node scripts/build-exact.mjs --emsdk "$RUNNER_TEMP/emsdk" --build-dir "$RUNNER_TEMP/axiom-build"
      - name: Verify generation and actual WASM against native C++ and BigInt oracles
        env:
          AXIOM_BUILD_DIR: ${{ runner.temp }}/axiom-build
        run: npm test
      - name: Record exact repository commit
        run: git rev-parse HEAD > browser/source-commit.txt
      - name: Upload verified complete browser module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-exact-math-browser
          path: browser/
          if-no-files-found: error
          retention-days: 14
