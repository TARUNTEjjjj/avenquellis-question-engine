name: Veyra Math edge generator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/native/**','include/**','edge/**','scripts/build-edge.sh','.github/workflows/edge.yml']
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned official Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin d7b4130688bfa348392b921ab04015aa15c4f154
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.13
          ./emsdk activate 6.0.13
      - name: Compile production C++ and inspect module
        env:
          EMXX: ${{ runner.temp }}/emsdk/upstream/emscripten/em++
          EM_CONFIG: ${{ runner.temp }}/emsdk/.emscripten
        run: bash scripts/build-edge.sh build-edge
      - name: Compare actual WebAssembly against the browser API
        run: node edge/verify.mjs build-edge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veyra-native-question-edge
          path: build-edge/
          if-no-files-found: error
          retention-days: 14
